linux:
  - 7
  - 8
  - 9
solaris:
  - 11
aix:
  - 1
  - 2



  ---
- name: Unix Local Account Scan (ULAS)
  hosts: all
  become: true
  gather_facts: false
  strategy: free

  tasks:
    # Wrapped so a mid-scan failure or an unreachable host can still be recorded
    # for the aggregated failed_hosts report sent in the play below.
    - block:
        - name: Record scan start time
          ansible.builtin.set_fact:
            _ts_start: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"

        - name: "[TIMESTAMP] Scan started"
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} | SCAN START | {{ _ts_start }}"

        # getent passwd value layout: [password_placeholder, uid, gid, gecos, home, shell]
        - name: Gather passwd database
          ansible.builtin.getent:
            database: passwd

        # getent group value layout: [password, gid, members_csv]
        - name: Gather group database
          ansible.builtin.getent:
            database: group

        - name: Gather OS distribution and local custom facts
          ansible.builtin.setup:
            gather_subset:
              - distribution
              - local

        # Sources tried in priority order for stage and datacentre:
        #   1. ansible_local.coba.comin_cache   — populated by /etc/ansible/comin-cache/comin-keyvalue
        #   2. ansible_local.coba.cloud_user_data.extra_vars — populated by /etc/cloud-user-data
        #   3. ansible_local.coba.config_cache  — populated by /etc/cbk/config/cache (via coba.fact)
        #   4. Direct slurp of /etc/cbk/config/cache — fallback when coba.fact is not deployed
        # ansible_local.coba is available when /etc/ansible/facts.d/coba.fact exists on the host.
        - name: Read host config cache as fallback when coba.fact is not deployed
          ansible.builtin.slurp:
            src: /etc/cbk/config/cache
          register: _host_cache_raw
          ignore_errors: true

        - name: Determine stage and datacentre from available sources
          ansible.builtin.set_fact:
            _stage: >-
              {%- set _stage_map = {
                'DEV': 'entw', 'ENTW': 'entw', 'dev': 'entw', 'entw': 'entw',
                'tuc': 'tuc', 'TUC': 'tuc', 'tu-c': 'tuc', 'TU-C': 'tuc',
                'tud': 'tud', 'TUD': 'tud', 'tu-d': 'tud', 'TU-D': 'tud',
                'prod': 'prod', 'prd': 'prod', 'PRD': 'prod', 'PROD': 'prod'
              } -%}
              {%- set _coba = ansible_local.coba | default({}) -%}
              {%- set _comin = _coba.comin_cache | default({}) -%}
              {%- set _cloud = (_coba.cloud_user_data | default({})).extra_vars | default({}) -%}
              {%- set _cfg   = _coba.config_cache | default({}) -%}
              {%- set _slurp = (_host_cache_raw.content | b64decode).split('\n')
                               | select('match', '^sys_systemtype=')
                               | map('regex_replace', '^sys_systemtype=', '')
                               | first | default('unknown') | trim
                               if _host_cache_raw is not failed else 'unknown' -%}
              {%- set _raw = _comin.COBA_ENV
                             if _comin.COBA_ENV is defined
                             else (_cloud.CBK_ENVIRONMENT
                               if _cloud.CBK_ENVIRONMENT is defined
                               else (_cfg.sys_systemtype
                                 if _cfg.sys_systemtype is defined
                                 else _slurp)) -%}
              {{ _stage_map[_raw] | default(_raw) | lower }}
            _datacentre: >-
              {%- set _dc_map = {
                'Frankfurt': 'ffm', 'fft': 'ffm', 'fra': 'ffm', 'ffm': 'ffm',
                'London': 'lon', 'ldn': 'lon', 'lon': 'lon',
                'Singapore': 'sgp', 'sgp': 'sgp',
                'New York': 'nyc', 'ny': 'nyc', 'nyc': 'nyc',
                'azr': 'ffm', 'GERMANYWESTCENTRAL': 'ffm',
                'gcp': 'ffm', 'EUROPE-WEST3': 'ffm', 'EUROPE-WEST4': 'ffm',
                'bdaa': 'bdaa'
              } -%}
              {%- set _coba = ansible_local.coba | default({}) -%}
              {%- set _comin = _coba.comin_cache | default({}) -%}
              {%- set _cloud = (_coba.cloud_user_data | default({})).extra_vars | default({}) -%}
              {%- set _cfg   = _coba.config_cache | default({}) -%}
              {%- set _slurp = (_host_cache_raw.content | b64decode).split('\n')
                               | select('match', '^loc_datacenter=')
                               | map('regex_replace', '^loc_datacenter=', '')
                               | first | default('unknown') | trim
                               if _host_cache_raw is not failed else 'unknown' -%}
              {%- set _raw = _comin.LOCATION
                             if _comin.LOCATION is defined
                             else (_cloud.LOCATION
                               if _cloud.LOCATION is defined
                               else (_cfg.loc_datacenter
                                 if _cfg.loc_datacenter is defined
                                 else _slurp)) -%}
              {{ _dc_map[_raw] | default(_raw) | lower }}

        # Format: [{username: "password:uid:gid:gecos:home:shell"}, ...]
        # This mirrors the raw /etc/passwd line content (without the leading "username:").
        - name: Build passwd_file snapshot
          ansible.builtin.set_fact:
            _passwd_file: "{{ _raw | from_json }}"
          vars:
            _raw: |
              {%- set ns = namespace(a=[]) -%}
              {%- for uname, pw in ansible_facts.getent_passwd.items() -%}
              {%-   set ns.a = ns.a + [{uname: pw[0] + ':' + pw[1] + ':' + pw[2] + ':' + pw[3] + ':' + pw[4] + ':' + pw[5]}] -%}
              {%- endfor -%}
              {{ ns.a | to_json }}

        # Format: [{groupname: "password:gid:members_csv"}, ...]
        - name: Build group_file snapshot
          ansible.builtin.set_fact:
            _group_file: "{{ _raw | from_json }}"
          vars:
            _raw: |
              {%- set ns = namespace(a=[]) -%}
              {%- for gname, gr in ansible_facts.getent_group.items() -%}
              {%-   set ns.a = ns.a + [{gname: gr[0] + ':' + gr[1] + ':' + gr[2]}] -%}
              {%- endfor -%}
              {{ ns.a | to_json }}

        - name: Build host result
          ansible.builtin.set_fact:
            ulas_host_result:
              machine_name: "{{ inventory_hostname }}"
              os_type: "Linux" #"{{ ansible_facts['distribution'] | lower }}"
              os_version: "{{ ansible_facts['distribution_version'] }}"
              os_name: "{{ ansible_facts['distribution'] }}"
              stage: "{{ _stage }}"
              datacentre: "{{ _datacentre }}"
              passwd_file: "{{ _passwd_file }}"
              group_file: "{{ _group_file }}"

        - name: Record post-scan timestamp
          ansible.builtin.set_fact:
            _ts_scanned: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"

        - name: "[TIMESTAMP] Scan data gathered"
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }} | SCAN DONE
              | passwd_entries={{ _passwd_file | length }}
              | group_entries={{ _group_file | length }}
              | stage={{ _stage }} | dc={{ _datacentre }}
              | at={{ _ts_scanned }}

        - name: Build POST payload for this host
          ansible.builtin.set_fact:
            ulas_payload:
              ansible_job_id: "{{ awx_job_id | default(lookup('env', 'AWX_JOB_ID')) | default('unknown') }}"
              hosts: [ "{{ ulas_host_result }}" ]

        - name: Send host result to API callback endpoint
          ansible.builtin.uri:
            url: "{{ ulas_callback_url }}"
            timeout: 60
            method: POST
            body_format: json
            body: "{{ ulas_payload }}"
            status_code: [200, 201, 202]
          register: _post_result

        - name: Record POST completion timestamp
          ansible.builtin.set_fact:
            _ts_posted: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"

        - name: "[TIMESTAMP] POST complete — final summary"
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }} | POST OK (HTTP {{ _post_result.status }})
              | started={{ _ts_start }} | scan_done={{ _ts_scanned }} | posted={{ _ts_posted }}

        - name: Print scan payload (debug)
          ansible.builtin.debug:
            msg: "{{ ulas_payload | to_nice_json }}"

      rescue:
        - name: Mark this host as failed for the aggregated failed_hosts report
          ansible.builtin.set_fact:
            ulas_host_failed: true

        - name: "[TIMESTAMP] Scan FAILED — final summary"
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }} | SCAN FAILED
              | reason={{ ansible_failed_result.msg | default('connection unreachable or task failure') }}

      # Converts connection-level UNREACHABLE into a regular failure so `rescue`
      # above still runs and the host can be reported in failed_hosts.
      ignore_unreachable: true

- name: Report aggregated failed hosts
  hosts: all
  gather_facts: false

  tasks:
    # Hosts that failed or were unreachable during the scan play mark themselves
    # via `ulas_host_failed`; read it back out of hostvars, which persist across
    # plays within the same run. Hosts named in --limit but absent from the
    # inventory are intentionally not reported here (backend team's request —
    # --limit can be a regex, so an unmatched entry isn't necessarily a real host).
    - name: Determine which hosts failed or were unreachable during the scan
      ansible.builtin.set_fact:
        _ulas_scan_failed: "{{ _raw | from_json }}"
      vars:
        _raw: |
          {%- set ns = namespace(a=[]) -%}
          {%- for h in groups['all'] -%}
          {%-   if hostvars[h].ulas_host_failed | default(false) -%}
          {%-     set ns.a = ns.a + [h] -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.a | to_json }}
      run_once: true
      delegate_to: localhost

    - name: Send aggregated failed_hosts notification to API callback endpoint
      ansible.builtin.uri:
        url: "{{ ulas_callback_url }}"
        timeout: 60
        method: POST
        body_format: json
        body:
          ansible_job_id: "{{ awx_job_id | default(lookup('env', 'AWX_JOB_ID')) | default('unknown') }}"
          failed_hosts: "{{ _ulas_scan_failed }}"
        status_code: [200, 201, 202]
      run_once: true
      delegate_to: localhost
